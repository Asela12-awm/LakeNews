
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LakeNews Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #e11d48
                );
        }

        .login-box {
            width: min(420px, 90%);

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 20px 60px rgba(0,0,0,.3);
        }

        .logo {
            text-align: center;

            font-size: 28px;

            font-weight: 800;

            margin-bottom: 10px;
        }

        .logo span {
            color: #e11d48;
        }

        h2 {
            text-align: center;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #ddd;

            border-radius: 10px;

            margin-bottom: 20px;

            outline: none;
        }

        input:focus {
            border-color: #e11d48;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #e11d48;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #be123c;
        }

        .flash {
            padding: 12px;

            background: #fee2e2;

            color: #991b1b;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #64748b;

            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        📰 Lake<span>News</span>
    </div>

    <h2>Admin Login</h2>

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="flash">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <form method="POST">

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Admin username"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <a href="/" class="back">
        ← Back to LakeNews
    </a>

</div>

</body>

</html>
